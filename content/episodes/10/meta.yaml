title: Olaf Kolkman (part 2)
description: >
  Olaf Kolkman has had a long career in networking and Open Source that
  led him to be working on Internet Technology, Policy and Advocacy at the
  Internet Society. In September 2025, we had a long conversation with him.

  In this second part of our discussion, we discussed the Internet
  Society (ISOC) and managing volunteer organisations.
